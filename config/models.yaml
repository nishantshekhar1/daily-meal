# LLM role → endpoint configuration (Ollama OpenAI-compatible API)
# Default: local Ollama on this machine. Override ollama_host for a remote GPU box.
#
# Running on a single smaller GPU? See config/profiles/ for ready-made
# configurations at 24 / 16 / 12 / 8 GB, selectable via CONFIG_PATH.

ollama_host: "127.0.0.1"

roles:
  # ── Reasoning ─────────────────────────────────────────────────────────────
  # Meal planning agent (tool calling). qwen3.6:35b is already on this box.
  reasoning:
    base_url: "http://{ollama_host}:11434/v1"
    model: "qwen3.6:35b"
    api_key: "ollama"
    max_tokens: 4096
    temperature: 0.4

  # ── Vision (ingredient photos) ────────────────────────────────────────────
  vision:
    base_url: "http://{ollama_host}:11434/v1"
    model: "qwen3-vl:8b"
    api_key: "ollama"
    max_tokens: 1024
    temperature: 0.1

  # ── OCR (receipts) ────────────────────────────────────────────────────────
  # No PaddleOCR in Ollama — reuse the vision VL model with an OCR prompt.
  ocr:
    base_url: "http://{ollama_host}:11434/v1"
    model: "qwen3-vl:8b"
    api_key: "ollama"
    max_tokens: 2048
    temperature: 0.0

  # ── Embeddings ────────────────────────────────────────────────────────────
  embedding:
    base_url: "http://{ollama_host}:11434/v1"
    model: "nomic-embed-text"
    api_key: "ollama"
    dimensions: 768

# ── Household preferences ───────────────────────────────────────────────────
preferences:
  # Cuisines in descending preference order. The planner asks the model to
  # tag each shortlisted dish with a cuisine, then re-ranks deterministically
  # by this order. Anything not listed ranks last.
  cuisine_priority:
    - indian
    - mexican
    - italian

  # How many recipes a plan contains. Each one costs a full LLM generation,
  # so this is the single biggest lever on planning time.
  max_suggestions: 3

# ── Feature flags ───────────────────────────────────────────────────────────
# Read by Settings.features in backend/app/core/config.py. These must live at
# the top level, not under `preferences`, or they silently fall back to
# hardcoded defaults.
features:
  # ── Web search ─────────────────────────────────────────────────────────────
  # Enrich the shortlist with recipe ideas from the web. Off by default: this
  # is the one feature that sends data off the machine, so enabling it trades
  # the app's local-only property for better variety.
  #
  # When on, the planner runs a `search_web` step before shortlisting. Results
  # are inspiration only — dishes are still constrained to pantry stock. Any
  # failure (no key, unreachable, slow) falls back to the model's own knowledge
  # rather than failing the request.
  web_search: true

  # "tavily"  → hosted API, needs TAVILY_API_KEY in backend/.env
  # "searxng" → self-hosted instance, keeps everything on your network
  #             (requires JSON output enabled: `formats: [html, json]`)
  web_search_provider: "tavily"

  tavily_search_depth: "basic"     # basic | advanced (advanced costs more credits)
  searxng_url: "http://localhost:8080"
  web_search_timeout_s: 8
  web_search_max_results: 5

  # Hard cap on searches per day, counted across every caller and persisted
  # across restarts. Tavily bills per search and trial keys are small, so this
  # is the backstop that keeps a background loop from draining the allowance.
  # Normal use is ~3-6/day (one per meal slot, plus one after each cook).
  # Set to 0 to stop all searching without touching web_search.
  web_search_daily_limit: 20

  # Generate the current slot's suggestions in the background so opening the
  # app shows a plan immediately instead of waiting on the model.
  prewarm_suggestions: true
  # How often the background worker re-checks that the cache is warm.
  prewarm_interval_s: 300
  # After a slot fails to produce a usable plan, leave it alone this long.
  # Empty plans are not cached, so without this the worker retries every
  # interval forever — each retry costing GPU time and a web search.
  prewarm_failure_cooldown_s: 3600

  # ── Learning from feedback ─────────────────────────────────────────────────
  # Use thumbs, cooked meals and skipped suggestions to re-rank future
  # suggestions and to hint the shortlist prompt.
  #
  # Turning this off still records and measures feedback, it just stops it
  # acting on suggestions — that is the baseline to compare against when you
  # want to know whether the loop is actually helping.
  learn_from_feedback: true

  # How often the background worker sweeps skipped suggestions, re-aggregates
  # preference profiles and snapshots quality metrics. Hours, not minutes: none
  # of the inputs move faster, and this competes with the model for the GPU.
  feedback_maintenance_interval_s: 21600

  # Trailing window for cook-through rate and the other quality metrics.
  metrics_window_days: 30

# ── Application ─────────────────────────────────────────────────────────────
app:
  db_url: "sqlite:///./data/daily_meal.db"
  upload_dir: "./uploads"
  low_stock_threshold_pct: 15
  planning_session_ttl_s: 3600
