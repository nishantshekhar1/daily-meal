# App stack: backend + frontend
# Run on any machine that can reach the GPU box.
# Copy .env.example → .env and fill in GPU_BOX_HOST before starting.

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      CONFIG_PATH: /app/config/models.yaml
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      LOG_LEVEL: INFO
    volumes:
      - ../config/models.yaml:/app/config/models.yaml:ro
      - app-data:/data
      - app-uploads:/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
