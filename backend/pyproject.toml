[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-meal-backend"
version = "0.1.0"
description = "Daily Meal Planner – FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # ORM / DB
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    # LLM client (OpenAI-compatible → Ollama)
    "openai>=1.40",
    # Agent orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Unit arithmetic
    "pint>=0.24",
    # Image handling
    "Pillow>=10.4",
    "python-multipart>=0.0.9",
    # Config
    "pyyaml>=6.0",
    "pydantic-settings>=2.3",
    # Utilities
    "httpx>=0.27",
    "anyio>=4.4",
    "tenacity>=8.5",
    "python-dateutil>=2.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
